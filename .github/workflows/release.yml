name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify tag matches manifest
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          test "${GITHUB_REF_NAME}" = "v${manifest_version}"

      - name: Test direction engine
        run: |
          node tools/accuracy.js
          node tools/accuracy.js tools/holdout.json
          node tools/accuracy.js tools/bidi-corpus.json

      - name: Audit manifest and URL matching
        run: |
          node tools/audit.test.js
          node tools/match.test.js

      - name: Run browser tests
        run: |
          node tools/browser-tests.js
          node tools/ui.test.js

      - name: Build and verify archive
        run: |
          node tools/build-release.js
          node tools/smoke-release.js

      - name: Create checksum
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "RastAI ${GITHUB_REF_NAME}"
