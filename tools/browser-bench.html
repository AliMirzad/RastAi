<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>RastAI runtime benchmark fixture</title>
  <style>
    body { margin: 0; font: 16px/1.5 Tahoma, sans-serif; }
    nav, main, footer { max-width: 800px; margin: 16px auto; }
    p { margin: 0 0 10px; }
    code, pre { font: 13px/1.5 monospace; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 4px 8px; }
  </style>
</head>
<body>
<nav id="site-chrome">Conversation history <span id="activity">0</span></nav>
<main><div id="stage" class="markdown"></div></main>
<footer><div contenteditable="true" aria-label="Message composer">متن پیام</div></footer>
<script>
/* The Node runner owns execution and samples Chromium's renderer CPU counters.
 * Timers, requestIdleCallback and requestAnimationFrame are NOT replaced.
 * This page is a visible-layout fixture, not an off-screen DOM microbenchmark.
 */
(() => {
  const stage = document.getElementById("stage");
  const activity = document.getElementById("activity");
  const sentence = "و بعد سه حالت مهمش را جدا می‌کنیم: static method، instance method و instance method روی هر object از یک ";
  const samples = [
    "این یک پاراگراف فارسی برای بررسی عملکرد نمایش گفتگو است.",
    "این متن درباره‌ی List&lt;String&gt;, Map&lt;String, Integer&gt; و روش کار آن‌هاست.",
    "کلاس <code>Box&lt;String&gt;</code> برای کپسول‌کردن استفاده می‌شود.",
    "This paragraph contains no Persian and should stay unchanged.",
    "آدرس سرور 127.0.0.1:8080 است و پورت 443 هم باز است.",
    "یک عدد بگیر → بررسی کن → نتیجه را نمایش بده."
  ];
  const store = { sync: {}, local: {} };
  const changed = [];
  const clone = value => value === undefined ? value : structuredClone(value);
  function area(name) {
    return {
      get(defaults, callback) {
        const result = {};
        for (const key of Object.keys(defaults)) {
          result[key] = key in store[name] ? clone(store[name][key]) : defaults[key];
        }
        setTimeout(() => callback(result), 0);
      },
      set(values, callback) {
        const changes = {};
        for (const key of Object.keys(values)) {
          changes[key] = { oldValue: clone(store[name][key]), newValue: clone(values[key]) };
          store[name][key] = clone(values[key]);
        }
        setTimeout(() => {
          changed.forEach(listener => listener(changes, name));
          if (callback) callback();
        }, 0);
      }
    };
  }
  window.chrome = {
    runtime: {
      getManifest: () => ({ content_scripts: [{ matches: ["file://*/*"] }] }),
      getURL: file => "../" + file,
      onMessage: { addListener() {} }
    },
    storage: {
      sync: area("sync"), local: area("local"),
      onChanged: { addListener: listener => changed.push(listener) }
    }
  };

  let lastMutation = performance.now();
  let records = 0;
  let callbacks = 0;
  new MutationObserver(batch => {
    lastMutation = performance.now();
    records += batch.length;
    callbacks++;
  }).observe(document.documentElement, {
    childList: true, subtree: true, characterData: true, attributes: true
  });
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function nativeParagraph(id) {
    const paragraph = document.createElement("p");
    paragraph.dir = "auto";
    paragraph.id = id;
    const span = document.createElement("span");
    span.textContent = sentence;
    const bdi = document.createElement("bdi");
    bdi.textContent = "type.";
    paragraph.append(span, bdi);
    return paragraph;
  }

  function conversation(size) {
    const fragment = document.createDocumentFragment();
    for (let index = 0; index < size; index++) {
      if (index % 20 === 0) {
        const heading = document.createElement("h2");
        heading.textContent = "عنوان بخش فارسی درباره‌ی Java";
        fragment.appendChild(heading);
      }
      if (index % 20 === 8) {
        const table = document.createElement("table");
        table.innerHTML = "<tbody><tr><th>مرحله</th><th>اتفاق</th></tr>" +
          "<tr><td>Runtime</td><td>JVM کلاس خام را می‌بیند</td></tr></tbody>";
        fragment.appendChild(table);
      }
      const paragraph = index % 12 === 0 ? nativeParagraph("native-" + index) : document.createElement("p");
      if (index % 12 !== 0) paragraph.innerHTML = samples[index % samples.length];
      fragment.appendChild(paragraph);
    }
    stage.replaceChildren(fragment);
  }

  function punctuationCorrect() {
    const bdi = stage.querySelector("p[dir=auto] > bdi:not([data-rastai-iso])");
    if (!bdi || !bdi.firstChild || bdi.firstChild.nodeType !== 3) return false;
    const range = document.createRange();
    range.setStart(bdi.firstChild, 0);
    range.setEnd(bdi.firstChild, 1);
    const first = range.getBoundingClientRect();
    range.setStart(bdi.firstChild, 4);
    range.setEnd(bdi.firstChild, 5);
    return range.getBoundingClientRect().left < first.left;
  }

  function snapshot() {
    return {
      marked: stage.querySelectorAll("[data-rastai-rtl]").length,
      isolated: stage.querySelectorAll("bdi[data-rastai-iso]").length,
      nativePunctuation: stage.querySelectorAll("bdi[data-rastai-punct]").length,
      punctuationCorrect: punctuationCorrect(), records, callbacks
    };
  }

  // Mark-count stability alone misses the deferred structural pass. Require
  // real-time calm longer than the streaming quiet/cache/revisit windows, and
  // restart that calm period after ANY DOM change (including wrappers/styles).
  async function settle() {
    const start = performance.now();
    while (performance.now() - start < 20000) {
      await wait(100);
      const now = performance.now();
      if (now - start >= 2500 && now - lastMutation >= 1200) return snapshot();
    }
    throw new Error("Renderer did not settle after deferred work within 20 seconds");
  }

  async function scroll() {
    const start = performance.now();
    const bottom = document.documentElement.scrollHeight - innerHeight;
    await new Promise(resolve => {
      function frame(now) {
        const elapsed = now - start;
        window.scrollTo(0, bottom * (0.5 - Math.cos(elapsed / 1500 * Math.PI * 2) / 2));
        if (elapsed >= 1500) resolve();
        else requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
    window.scrollTo(0, 0);
  }

  async function unrelatedUpdates() {
    for (let index = 0; index < 40; index++) {
      activity.textContent = String(index);
      await wait(16);
    }
  }

  async function streaming() {
    const marker = document.createElement("button");
    marker.setAttribute("data-testid", "stop-button");
    marker.textContent = "Stop";
    document.body.appendChild(marker);
    const paragraph = nativeParagraph("streaming-paragraph");
    paragraph.setAttribute("data-is-streaming", "true");
    stage.appendChild(paragraph);
    const text = paragraph.firstChild.firstChild;
    for (let index = 0; index < 48; index++) {
      text.data = sentence + "این پاسخ در حال تولید است. ".repeat(index + 1);
      // A site's renderer can replace its native BDI even when the text is
      // unchanged; this must still receive the punctuation correction.
      if (index % 8 === 0) {
        const tail = document.createElement("bdi");
        tail.textContent = "type.";
        paragraph.lastChild.replaceWith(tail);
      }
      await wait(20);
    }
    text.data = sentence + "برای نمونه List<String> را هم بررسی می‌کنیم. ";
    paragraph.removeAttribute("data-is-streaming");
    marker.remove();
  }

  window.Bench = {
    prepare(enabled, size) {
      const host = location.hostname.replace(/^www\./, "");
      store.sync = { rtlMode: "smart", siteOff: enabled ? {} : { [host]: true } };
      conversation(size);
    },
    reset() { records = 0; callbacks = 0; },
    settle, snapshot, wait, scroll, unrelatedUpdates, streaming,
    rerender: size => conversation(size)
  };
})();
</script>
</body>
</html>
